<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document Intelligence</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Document Intelligence</h1>
            <p>Upload a document and ask questions about it.</p>
        </header>


        <section class="card">

            <h2>Upload Document</h2>

            <input
                type="file"
                id="fileInput"
                accept=".pdf"
            >

            <button id="uploadButton">
                Upload & Process
            </button>

            <div id="uploadStatus"></div>

            <div id="documentStats"></div>

        </section>


        <section class="card">

            <h2>Ask a Question</h2>

            <textarea
                id="questionInput"
                placeholder="e.g. What was the company's revenue in 2025?"
            ></textarea>

            <button id="askButton">
                Ask Question
            </button>

        </section>


        <section
            class="card"
            id="answerSection"
            style="display: none;"
        >

            <h2>Answer</h2>

            <div id="answer"></div>

            <h3>Sources</h3>

            <div id="sources"></div>

        </section>

    </div>

    <script src="/static/app.js"></script>

</body>
</html>
